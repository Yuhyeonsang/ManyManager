# ============================================================
# Pi 자동 배포 (Self-hosted Runner 방식)
# ============================================================
# 구조: GitHub → (인터넷) ← Pi가 폴링
#
#   ┌─────────────┐                ┌─────────────┐
#   │  GitHub     │  ← outbound ── │  Pi runner  │
#   │  (job 대기) │   HTTPS only   │  (집 안)    │
#   └─────────────┘                └─────────────┘
#
# 장점:
#   - 집 공유기 22번 (SSH) 안 열어도 됨 → 보안 ↑
#   - 동적 IP / 이중 NAT 무관 → 어떤 인터넷 환경에서도 동작
#   - Pi에 secrets 저장 안 함 → GitHub Secrets만 관리
#
# 단점:
#   - Pi에 runner 데몬 한 번 설치해야 함 (10분)
#
# 사전 준비:
#   1) Pi에서 setup_pi3.sh (또는 setup_pi.sh) 실행 완료
#   2) Pi에 GitHub Actions runner 설치 (PI_DEPLOY_GUIDE.md 참고)
#      → 셋업 끝나면 GitHub Repo Settings → Actions → Runners 에
#        "fundpi" 라벨로 등록되어 있어야 함
# ============================================================

name: Deploy to Raspberry Pi

on:
  workflow_dispatch:        # 수동 실행 가능
  push:
    branches: [main]
    paths:
      - '*.py'
      - 'requirements.txt'
      - '.github/workflows/deploy-pi.yml'

jobs:
  deploy:
    name: Pi에 git pull + 서비스 재시작
    # 중요: GitHub 호스팅 러너(ubuntu-latest) 가 아니라 Pi 자체 러너 사용
    runs-on: [self-hosted, fundpi]
    timeout-minutes: 10

    steps:
      - name: Checkout (Pi의 로컬 디스크에 그대로 받음)
        uses: actions/checkout@v4

      - name: 코드를 운영 디렉토리에 동기화
        run: |
          set -e
          echo "▶ 배포 시작 $(date '+%F %T')"
          cd /home/pi/ManyManager
          git fetch origin main
          git reset --hard origin/main

      - name: .env 생성 (GitHub Secrets → Pi의 .env 파일)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY:   ${{ secrets.GROQ_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          DART_API_KEY:   ${{ secrets.DART_API_KEY }}
        run: |
          cd /home/pi/ManyManager
          cat > .env <<EOF
          GEMINI_API_KEY=${GEMINI_API_KEY}
          GEMINI_MODEL=gemini-2.5-flash
          GROQ_API_KEY=${GROQ_API_KEY}
          GROQ_MODEL=llama-3.1-8b-instant
          NAVER_CLIENT_ID=${NAVER_CLIENT_ID}
          NAVER_CLIENT_SECRET=${NAVER_CLIENT_SECRET}
          DART_API_KEY=${DART_API_KEY}
          CACHE_WARM_ENABLED=0
          LOOP_INTERVAL_MIN=60
          EOF
          chmod 600 .env
          echo "✔ .env 동기화 완료"

      - name: 의존성 설치 (변경 시만)
        run: |
          cd /home/pi/ManyManager
          source .venv/bin/activate
          # piwheels 사용 → Pi 3B+ 라도 컴파일 없음
          pip install --quiet \
            --extra-index-url https://www.piwheels.org/simple/ \
            -r requirements.txt --upgrade

      - name: systemd 서비스 재시작
        run: |
          sudo systemctl restart manymanager
          sleep 10
          sudo systemctl is-active manymanager || (
            echo "❌ 서비스 시작 실패"
            sudo journalctl -u manymanager -n 30 --no-pager
            exit 1
          )

      - name: 헬스체크
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 30 http://localhost:8000/ || echo "000")
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✔ HTTP 200 — 배포 성공"
          else
            echo "❌ 헬스체크 실패 (HTTP $HTTP_CODE)"
            sudo journalctl -u manymanager -n 50 --no-pager
            exit 1
          fi

      - name: 상태 요약
        if: always()
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo " Pi 상태"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo " 시간   : $(date '+%F %T')"
          echo " 온도   : $(vcgencmd measure_temp 2>/dev/null || echo N/A)"
          echo " 메모리 : $(free -h | grep Mem | awk '{print $3 " / " $2}')"
          echo " 스왑   : $(free -h | grep Swap | awk '{print $3 " / " $2}')"
          echo " 서비스 : $(systemctl is-active manymanager)"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
