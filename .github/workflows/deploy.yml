name: Deploy to Oracle Cloud

# main 브랜치에 파이썬/의존성/배포 관련 파일 푸시 시 자동 배포.
# 수동 실행도 여전히 가능 (workflow_dispatch).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '*.py'
      - 'requirements.txt'
      - 'runtime.txt'
      - 'deploy/**'
      - '.github/workflows/deploy.yml'

jobs:
  deploy:
    name: SSH → git pull → systemctl restart
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          port: ${{ secrets.ORACLE_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            echo "▶ 배포 시작 $(date '+%F %T')"
            cd /home/ubuntu/ManyManager

            echo "▶ git pull"
            git fetch origin main
            git reset --hard origin/main

            echo "▶ requirements.txt 업데이트 확인"
            source .venv/bin/activate
            pip install -r requirements.txt --quiet --upgrade

            echo "▶ FastAPI 재시작"
            pkill -f "uvicorn main:app" || true
            sleep 2
            nohup .venv/bin/uvicorn main:app --host 0.0.0.0 --port 8000 > /home/ubuntu/fastapi.log 2>&1 &

            sleep 3
            echo "▶ 헬스체크"
            curl -sS -o /dev/null -w "HTTP %{http_code} (%{time_total}s)\n" http://localhost:8000/

            echo "✔ 배포 완료"