name: Deploy to Oracle Cloud

# main 브랜치에 파이썬/의존성/배포 관련 파일 푸시 시 자동 배포.
# 수동 실행도 여전히 가능 (workflow_dispatch).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '*.py'
      - 'requirements.txt'
      - 'runtime.txt'
      - 'deploy/**'
      - '.github/workflows/deploy.yml'

jobs:
  deploy:
    name: SSH → git pull → systemctl restart
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          port: ${{ secrets.ORACLE_PORT || 22 }}
          # GitHub Secrets 를 SSH 환경변수로 주입 → 스크립트 안에서 .env 생성에 사용
          envs: GROQ_API_KEY,GEMINI_API_KEY,NAVER_CLIENT_ID,NAVER_CLIENT_SECRET,DART_API_KEY
          script_stop: true
          script: |
            set -e
            echo "▶ 배포 시작 $(date '+%F %T')"
            cd /home/ubuntu/ManyManager

            echo "▶ git pull"
            git fetch origin main
            git reset --hard origin/main

            echo "▶ .env 동기화 (GitHub Secrets → 서버)"
            cat > .env <<EOF
            GROQ_API_KEY=${GROQ_API_KEY}
            GROQ_MODEL=llama-3.1-8b-instant
            GEMINI_API_KEY=${GEMINI_API_KEY}
            GEMINI_MODEL=gemini-2.0-flash
            NAVER_CLIENT_ID=${NAVER_CLIENT_ID}
            NAVER_CLIENT_SECRET=${NAVER_CLIENT_SECRET}
            DART_API_KEY=${DART_API_KEY}
            CACHE_WARM_ENABLED=0
            EOF
            chmod 600 .env

            echo "▶ requirements.txt 업데이트 확인"
            source .venv/bin/activate
            pip install -r requirements.txt --quiet --upgrade

            echo "▶ FastAPI 재시작"
            pkill -9 -x uvicorn 2>/dev/null || true
            sleep 1

            setsid -f /home/ubuntu/ManyManager/.venv/bin/uvicorn main:app \
              --host 0.0.0.0 --port 8000 \
              </dev/null >/home/ubuntu/fastapi.log 2>&1

            echo "✔ 배포 완료 (uvicorn 백그라운드 기동)"
            exit 0
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}