name: Deploy to Oracle Cloud (LEGACY — disabled)

# ⚠️  이 워크플로는 Oracle Cloud 배포용입니다 (이전 인프라).
# Pi로 이전한 뒤 자동 트리거를 끄고, 수동 실행만 가능하게 했어요.
#
# Pi 배포는 .github/workflows/deploy-pi.yml 을 사용합니다.
#
# Oracle을 완전히 종료할 거면 이 파일 통째로 삭제하세요.
# (남겨두면: 나중에 Oracle로 롤백할 때 Actions 탭에서 수동 실행 가능)

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Oracle Cloud — Manual SSH Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          port: ${{ secrets.ORACLE_PORT || 22 }}
          envs: GROQ_API_KEY,GEMINI_API_KEY,NAVER_CLIENT_ID,NAVER_CLIENT_SECRET,DART_API_KEY
          script_stop: true
          script: |
            set -e
            echo "▶ 배포 시작 $(date '+%F %T')"
            cd /home/ubuntu/ManyManager
            git fetch origin main
            git reset --hard origin/main

            cat > .env <<EOF
            GROQ_API_KEY=${GROQ_API_KEY}
            GROQ_MODEL=llama-3.1-8b-instant
            GEMINI_API_KEY=${GEMINI_API_KEY}
            GEMINI_MODEL=gemini-2.0-flash
            NAVER_CLIENT_ID=${NAVER_CLIENT_ID}
            NAVER_CLIENT_SECRET=${NAVER_CLIENT_SECRET}
            DART_API_KEY=${DART_API_KEY}
            CACHE_WARM_ENABLED=0
            EOF
            chmod 600 .env

            source .venv/bin/activate
            pip install -r requirements.txt --quiet --upgrade

            pkill -9 -x uvicorn 2>/dev/null || true
            sleep 1
            setsid -f /home/ubuntu/ManyManager/.venv/bin/uvicorn main:app --host 0.0.0.0 --port 8000 </dev/null >/home/ubuntu/fastapi.log 2>&1
            echo "✔ Oracle 배포 완료"
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
